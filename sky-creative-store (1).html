<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sky Creative Store</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#FFF7ED;--surface:#FFFFFF;--soft:#FFEDD5;--primary:#F97316;--amber:#F59E0B;--text:#1F2937;--muted:#6B7280;--border:#FED7AA;--accent:#FFEDD5;--success:#22C55E;--danger:#EF4444;--r:20px;--rs:12px;--sh:0 2px 24px rgba(249,115,22,.10);--shl:0 8px 40px rgba(249,115,22,.18)}
body.dark{--bg:#0C0A09;--surface:#1C1917;--soft:#292524;--primary:#FB923C;--amber:#FBBF24;--text:#FFF7ED;--muted:#D6D3D1;--border:#44403C;--accent:rgba(251,146,60,.12);--sh:0 2px 24px rgba(0,0,0,.4);--shl:0 8px 40px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s;min-height:100vh}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit;border:none;background:none}
input,textarea,select{font-family:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px}

/* Layout */
.container{max-width:1200px;margin:0 auto;padding:0 20px}
.section{padding:72px 0}
@media(max-width:600px){.section{padding:48px 0}}

/* Grid */
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media(max-width:960px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:580px){.g4,.g3,.g2{grid-template-columns:1fr}}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;border-radius:var(--rs);font-weight:700;font-size:14px;transition:all .2s;cursor:pointer;border:none}
.btn-pri{background:var(--primary);color:#fff;box-shadow:0 4px 16px rgba(249,115,22,.35)}
.btn-pri:hover{background:#ea6c0e;transform:translateY(-1px);box-shadow:0 6px 20px rgba(249,115,22,.45)}
.btn-out{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn-out:hover{background:var(--accent)}
.btn-ghost{background:var(--accent);color:var(--primary)}
.btn-ghost:hover{filter:brightness(.95)}
.btn-lg{padding:14px 28px;font-size:15px}
.btn-sm{padding:7px 14px;font-size:12px}

/* Card */
.card{background:var(--surface);border-radius:var(--r);border:1.5px solid var(--border);box-shadow:var(--sh);transition:all .25s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shl)}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.3px}
.b-best{background:#DCFCE7;color:#16A34A}
.b-promo{background:#FEF9C3;color:#CA8A04}
.b-ready{background:#DBEAFE;color:#2563EB}
.b-custom{background:#F3E8FF;color:#7C3AED}
.b-new{background:var(--accent);color:var(--primary)}
body.dark .b-best{background:rgba(34,197,94,.15);color:#22C55E}
body.dark .b-promo{background:rgba(251,191,36,.15);color:#FBBF24}
body.dark .b-ready{background:rgba(37,99,235,.15);color:#60A5FA}
body.dark .b-custom{background:rgba(124,58,237,.15);color:#A78BFA}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .2s}
.chip:hover,.chip.on{background:var(--accent);border-color:var(--primary);color:var(--primary)}

/* Tags */
.tag{display:inline-block;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;background:var(--accent);color:var(--primary);margin-bottom:14px}

/* Misc */
.grad{background:linear-gradient(135deg,var(--primary),var(--amber));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ibox{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--primary);flex-shrink:0;font-size:22px}
.divider{height:1px;background:var(--border);margin:20px 0}
.inp{width:100%;padding:11px 15px;border-radius:var(--rs);border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--primary)}
.inp::placeholder{color:var(--muted)}

/* Header */
#header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1.5px solid var(--border);box-shadow:var(--sh)}
.nav-btn{background:none;border:none;padding:8px 11px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);transition:all .2s;cursor:pointer;white-space:nowrap}
.nav-btn:hover,.nav-btn.on{color:var(--primary);background:var(--accent);font-weight:700}

/* Hero */
#hero{padding:96px 0 72px;background:linear-gradient(135deg,#FFF7ED 0%,#FFEDD5 50%,#FEF3C7 100%);position:relative;overflow:hidden}
body.dark #hero{background:linear-gradient(135deg,#0C0A09 0%,#1C1917 60%,#0C0A09 100%)}
.orb{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none}

/* Mobile menu */
#mob-menu{position:fixed;top:0;right:0;bottom:0;width:280px;background:var(--surface);z-index:400;padding:24px;box-shadow:var(--shl);transform:translateX(100%);transition:transform .3s;border-left:1.5px solid var(--border);overflow-y:auto}
#mob-menu.open{transform:translateX(0)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;backdrop-filter:blur(3px)}
#mob-btn{background:var(--accent);border:none;border-radius:10px;width:36px;height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
#mob-btn span{width:18px;height:2px;background:var(--primary);border-radius:2px;transition:all .3s}

/* Product card */
.pc{padding:18px}
.pc .img{height:160px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:54px;margin-bottom:14px;transition:transform .25s;position:relative}
.pc:hover .img{transform:scale(1.03)}

/* Stat cards */
.stat{background:var(--surface);border-radius:var(--rs);border:1.5px solid var(--border);padding:22px;box-shadow:var(--sh)}

/* Sidebar */
#sidebar{background:var(--surface);border-right:1.5px solid var(--border);padding:20px 14px;width:240px;height:calc(100vh - 57px);position:sticky;top:57px;overflow-y:auto;flex-shrink:0}
.sl{display:flex;align-items:center;gap:9px;padding:9px 13px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);transition:all .2s;cursor:pointer;user-select:none}
.sl:hover,.sl.on{background:var(--accent);color:var(--primary)}
.sl .ico{font-size:15px;width:18px;text-align:center}

/* Toast */
#toast{position:fixed;bottom:24px;right:24px;z-index:999;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rs);padding:14px 18px;box-shadow:var(--shl);display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;animation:slideUp .3s ease;max-width:320px}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fadeUp .6s ease both}
.fu1{animation-delay:.1s}.fu2{animation-delay:.2s}.fu3{animation-delay:.3s}.fu4{animation-delay:.4s}

/* Modal */
.modal-wrap{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--surface);border-radius:var(--r);padding:28px;width:100%;max-width:500px;max-height:88vh;overflow-y:auto;box-shadow:var(--shl);border:1.5px solid var(--border);position:relative;z-index:1}

/* Order status */
.os{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:99px;font-size:11px;font-weight:800}
.os-p{background:#FEF9C3;color:#CA8A04}
.os-pr{background:#DBEAFE;color:#2563EB}
.os-d{background:#DCFCE7;color:#16A34A}
body.dark .os-p{background:rgba(251,191,36,.15);color:#FBBF24}
body.dark .os-pr{background:rgba(37,99,235,.15);color:#60A5FA}
body.dark .os-d{background:rgba(34,197,94,.15);color:#22C55E}

/* Table */
table{width:100%;border-collapse:collapse}
th{padding:11px 14px;text-align:left;font-size:12px;font-weight:700;color:var(--muted);border-bottom:2px solid var(--border)}
td{padding:11px 14px;font-size:13px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
.scroll-x{overflow-x:auto}

/* Progress */
.pb{height:6px;border-radius:9px;background:var(--soft);overflow:hidden}
.pf{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--primary),var(--amber))}

/* Responsive nav */
@media(min-width:901px){#mob-btn,.mob-only{display:none!important}}
@media(max-width:900px){.desk-only{display:none!important}.g-admin{grid-template-columns:1fr!important}#sidebar{display:none!important}}
@media(max-width:700px){#search-wrap{display:none!important}}

/* Stars */
.stars{color:#F59E0B;letter-spacing:1px}
</style>
</head>

</header>

// ─── DARK MODE ──────────────────────────────────────────────────
function initDark(){
  const d=localStorage.getItem('sky-dark')==='1';
  if(d){document.body.classList.add('dark');document.getElementById('darkbtn').textContent='☀️'}
}
function toggleDark(){
  const d=document.body.classList.toggle('dark');
  document.getElementById('darkbtn').textContent=d?'☀️':'🌙';
  localStorage.setItem('sky-dark',d?'1':'0');
}

// ─── TOAST ──────────────────────────────────────────────────────
let toastTimer;
function showToast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.innerHTML=(type==='ok'?'<span style="color:var(--success);font-size:18px">✓</span> ':'<span style="color:var(--danger);font-size:18px">✗</span> ')+msg;
  t.style.display='flex';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.style.display='none'},3000);
}

  document.getElementById('mob-menu').classList.add('open');
  document.getElementById('mob-overlay').style.display='block';
}
function closeMob(){
  document.getElementById('mob-menu').classList.remove('open');
  document.getElementById('mob-overlay').style.display='none';
}

// ─── CART ───────────────────────────────────────────────────────
function addToCart(id){
  const p=PRODUCTS.find(x=>x.id===id);
  cart.push({...p});
  updateCartBadge();
  showToast(p.name+' ditambahkan ke keranjang!');
  renderCartItems();
}
function removeFromCart(i){
  cart.splice(i,1);
  updateCartBadge();
  renderCartItems();
}
function updateCartBadge(){
  const b=document.getElementById('cart-badge');
  if(cart.length>0){b.style.display='flex';b.textContent=cart.length}
  else b.style.display='none';
}
function openCart(){
  renderCartItems();
  document.getElementById('cart-drawer').style.transform='translateX(0)';
  document.getElementById('cart-overlay').style.display='block';
}
function closeCart(){
  document.getElementById('cart-drawer').style.transform='translateX(100%)';
  document.getElementById('cart-overlay').style.display='none';
}
function renderCartItems(){
  const el=document.getElementById('cart-items');
  if(cart.length===0){
    el.innerHTML='<div style="text-align:center;padding:48px 0;color:var(--muted)"><div style="font-size:48px;margin-bottom:12px">🛒</div><p style="font-weight:600">Keranjang masih kosong</p></div>';
    return;
  }
  const total=cart.reduce((a,c)=>a+c.price,0);
  let h='';
  cart.forEach((item,i)=>{
    h+=`<div style="display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--border)">
      <span style="font-size:28px">${item.emoji}</span>
      <div style="flex:1">
        <div style="font-weight:600;font-size:14px">${item.name}</div>
        <div style="color:var(--primary);font-weight:700;font-size:13px">Rp ${item.price.toLocaleString('id')}</div>
      </div>
      <button onclick="removeFromCart(${i})" style="background:var(--accent);border:none;border-radius:8px;width:28px;height:28px;cursor:pointer;color:var(--danger);font-size:16px;font-weight:700">×</button>
    </div>`;
  });
  h+=`<div style="margin-top:16px;padding:14px;background:var(--accent);border-radius:12px">
    <div style="display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:4px">
      <span>Total</span><span style="color:var(--primary)">Rp ${total.toLocaleString('id')}</span>
    </div>
    <p style="font-size:11px;color:var(--muted)">*Belum termasuk ongkos kirim</p>
  </div>
  <div style="display:flex;gap:10px;margin-top:14px">
    <button class="btn btn-pri" style="flex:1;justify-content:center" onclick="closeCart();openOrderModal(null)">Checkout</button>
    <a href="https://wa.me/628123456789?text=Halo%2C+saya+ingin+order:+${encodeURIComponent(cart.map(c=>c.name).join(', '))}" target="_blank" class="btn btn-ghost" style="flex:1;justify-content:center">💬 Via WA</a>
  </div>`;
  el.innerHTML=h;
}

// ─── SEARCH ─────────────────────────────────────────────────────
function doHeaderSearch(v){
  const res=document.getElementById('search-res');
  if(v.length<2){res.style.display='none';return;}
  const matches=PRODUCTS.filter(p=>p.name.toLowerCase().includes(v.toLowerCase())).slice(0,5);
  if(!matches.length){res.style.display='none';return;}
  res.innerHTML=matches.map(p=>`<div onclick="showPage('${p.cat}');document.getElementById('hsearch').value='';document.getElementById('search-res').style.display='none'" style="padding:10px 14px;cursor:pointer;font-size:13px;display:flex;gap:9px;align-items:center;border-bottom:1px solid var(--border)" onmouseover="this.style.background='var(--accent)'" onmouseout="this.style.background=''">
    <span>${p.emoji}</span><div><div style="font-weight:600">${p.name}</div><div style="color:var(--muted);font-size:11px">Rp ${p.price.toLocaleString('id')}</div></div>
  </div>`).join('');
  res.style.display='block';
}

// ─── FILTER PRODUCTS ────────────────────────────────────────────
function setFilter(cat){
  filterCat=cat;
  document.querySelectorAll('[id^="chip-"]').forEach(el=>{
    el.classList.remove('on');
    if(el.id==='chip-'+cat)el.classList.add('on');
  });
  if(cat==='all'){document.getElementById('chip-all').classList.add('on')}
  filterProducts();
}
function filterProducts(){
  const q=(document.getElementById('prod-search')||{value:''}).value.toLowerCase();
  const grid=document.getElementById('prod-grid');
  const empty=document.getElementById('prod-empty');
  if(!grid)return;
  const items=grid.querySelectorAll('.card');
  let visible=0;
  PRODUCTS.forEach((p,i)=>{
    const match=(filterCat==='all'||p.cat===filterCat)&&(q===''||p.name.toLowerCase().includes(q));
    if(items[i]){items[i].style.display=match?'':'none';if(match)visible++;}
  });
  if(empty){empty.style.display=visible?'none':'block';}
}

// ─── ADMIN ──────────────────────────────────────────────────────
function setAdminPage(page){
  adminPage=page;
  document.querySelectorAll('.sl').forEach(el=>{
    el.classList.toggle('on',el.textContent.trim()===page);
  });
  const title=document.getElementById('admin-title');
  if(title)title.textContent=page;
}

// ─── ROUTING ────────────────────────────────────────────────────
const CATS_IDS=CATS.map(c=>c.id);
function showPage(page){
  currentPage=page;
  filterCat='all';
  const app=document.getElementById('app');
  const isAdmin=page==='dashboard-admin';
  document.getElementById('header').style.display=isAdmin?'none':'';

  // Update active nav
  document.querySelectorAll('.nav-btn[data-page]').forEach(b=>{
    b.classList.toggle('on',b.dataset.page===page);
  });

  let html='';
  if(page==='home'){
    html=renderHome()+renderFooter();
  } else if(CATS_IDS.includes(page)){
    html=renderCategoryPage(page)+renderFooter();
  } else if(page==='cek-order'){
    html=renderCekOrder()+renderFooter();
  } else if(page==='dashboard-admin'){
    html=`<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 20px;background:var(--surface);border-bottom:1.5px solid var(--border)">

  window.scrollTo(0,0);
}
