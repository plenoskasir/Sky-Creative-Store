<html lang="id">

<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
:root {
  --bg: #FFF7ED; --surface: #FFFFFF; --soft-surface: #FEF3E2;
  --primary: #F97316; --amber: #F59E0B; --text: #1F2937;
  --muted: #6B7280; --border: #FED7AA; --accent: #FFEDD5;
  --success: #22C55E; --danger: #EF4444;
  --shadow: 0 2px 24px rgba(249,115,22,0.10);
  --shadow-lg: 0 8px 40px rgba(249,115,22,0.16);
  --radius: 20px; --radius-sm: 12px; --radius-xs: 8px;
}
.dark {
  --bg: #0C0A09; --surface: #1C1917; --soft-surface: #292524;
  --primary: #FB923C; --amber: #FBBF24; --text: #FFF7ED;
  --muted: #D6D3D1; --border: #44403C; --accent: rgba(251,146,60,0.12);
  --success: #22C55E; --danger: #F87171;
  --shadow: 0 2px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s;min-height:100vh}
h1,h2,h3,h4,h5{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700}
.display{font-family:'Plus Jakarta Sans',sans-serif}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}
input,textarea,select{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:var(--radius-sm);font-weight:600;font-size:15px;border:none;transition:all .2s;cursor:pointer}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 16px rgba(249,115,22,0.35)}
.btn-primary:hover{background:#ea6c0e;transform:translateY(-1px);box-shadow:0 6px 20px rgba(249,115,22,0.45)}
.btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn-outline:hover{background:var(--accent)}
.btn-ghost{background:var(--accent);color:var(--primary)}
.btn-ghost:hover{background:var(--border)}
.btn-sm{padding:8px 16px;font-size:13px}
.btn-lg{padding:16px 32px;font-size:16px}
.card{background:var(--surface);border-radius:var(--radius);border:1.5px solid var(--border);box-shadow:var(--shadow);transition:all .25s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.4px}
.badge-promo{background:#FEF9C3;color:#CA8A04}
.dark .badge-promo{background:rgba(251,191,36,0.15);color:#FBBF24}
.badge-best{background:#DCFCE7;color:#16A34A}
.dark .badge-best{background:rgba(34,197,94,0.15);color:#22C55E}
.badge-ready{background:#DBEAFE;color:#2563EB}
.dark .badge-ready{background:rgba(37,99,235,0.15);color:#60A5FA}
.badge-custom{background:#F3E8FF;color:#7C3AED}
.dark .badge-custom{background:rgba(124,58,237,0.15);color:#A78BFA}
.badge-new{background:var(--accent);color:var(--primary)}
.section{padding:72px 0}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
.section-title{font-size:clamp(28px,4vw,40px);font-weight:800;margin-bottom:12px;letter-spacing:-1px}
.section-sub{color:var(--muted);font-size:16px;margin-bottom:48px;max-width:560px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.section{padding:48px 0}}
.tag{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;background:var(--accent);color:var(--primary);margin-bottom:16px}
.gradient-text{background:linear-gradient(135deg,var(--primary),var(--amber));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.icon-box{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--primary);flex-shrink:0}
.sticky{position:sticky;top:0;z-index:100}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;backdrop-filter:blur(4px)}
.modal{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--surface);border-radius:var(--radius);padding:32px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.input-field{width:100%;padding:12px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.input-field:focus{border-color:var(--primary)}
.input-field::placeholder{color:var(--muted)}
.sidebar-link{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:var(--radius-xs);font-size:14px;font-weight:500;color:var(--muted);transition:all .2s;cursor:pointer}
.sidebar-link:hover,.sidebar-link.active{background:var(--accent);color:var(--primary)}
.stat-card{background:var(--surface);border-radius:var(--radius-sm);border:1.5px solid var(--border);padding:24px;box-shadow:var(--shadow)}
.hero-bg{position:relative;overflow:hidden;background:linear-gradient(135deg,#FFF7ED 0%,#FFEDD5 50%,#FEF3C7 100%)}
.dark .hero-bg{background:linear-gradient(135deg,#0C0A09 0%,#1C1917 50%,#0C0A09 100%)}
.hero-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.4;pointer-events:none}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
.fade-up{animation:fadeUp .6s ease both}
.fade-up-1{animation-delay:.1s}
.fade-up-2{animation-delay:.2s}
.fade-up-3{animation-delay:.3s}
.fade-up-4{animation-delay:.4s}
.float{animation:float 4s ease-in-out infinite}
.toast{position:fixed;bottom:24px;right:24px;z-index:999;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:16px 20px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;animation:fadeUp .3s ease}
.progress-bar{height:6px;border-radius:99px;background:var(--accent);overflow:hidden}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--amber));transition:width .4s}
.hamburger{display:flex;flex-direction:column;gap:5px;cursor:pointer;padding:8px}
.hamburger span{width:22px;height:2px;background:var(--text);border-radius:2px;transition:all .3s}
.mobile-menu{position:fixed;top:0;right:0;bottom:0;width:280px;background:var(--surface);z-index:400;padding:24px;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .3s;border-left:1.5px solid var(--border)}
.mobile-menu.open{transform:translateX(0)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;font-size:13px;font-weight:500;border:1.5px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:all .2s}
.chip:hover,.chip.active{background:var(--accent);border-color:var(--primary);color:var(--primary)}
.product-card{position:relative;overflow:hidden}
.product-card .img-area{height:180px;border-radius:var(--radius-sm);overflow:hidden;margin-bottom:16px;background:var(--soft-surface);display:flex;align-items:center;justify-content:center;transition:all .25s}
.product-card:hover .img-area{transform:scale(1.02)}
.testimonial-card{background:var(--surface);border-radius:var(--radius);border:1.5px solid var(--border);padding:28px;box-shadow:var(--shadow)}
.stars{color:#F59E0B;font-size:16px}
.order-status{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700}
.status-pending{background:#FEF9C3;color:#CA8A04}
.dark .status-pending{background:rgba(251,191,36,0.15);color:#FBBF24}
.status-process{background:#DBEAFE;color:#2563EB}
.dark .status-process{background:rgba(37,99,235,0.15);color:#60A5FA}
.status-done{background:#DCFCE7;color:#16A34A}
.dark .status-done{background:rgba(34,197,94,0.15);color:#22C55E}
.divider{height:1px;background:var(--border);margin:24px 0}
table{width:100%;border-collapse:collapse}
th{padding:12px 16px;text-align:left;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid var(--border)}
td{padding:12px 16px;font-size:14px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
.admin-layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
@media(max-width:900px){.admin-layout{grid-template-columns:1fr}}
.sidebar{background:var(--surface);border-right:1.5px solid var(--border);padding:24px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
@media(max-width:900px){.sidebar{display:none}}
.scroll-x{overflow-x:auto}
</style>
</head>

const Icon = ({ name, size=20, ...p }) => {
  const el = useRef(null);
  useEffect(()=>{
    if(window.lucide && el.current){
      el.current.innerHTML='';
      const svg = window.lucide.createElement(name);
      if(svg){ svg.setAttribute('width',size); svg.setAttribute('height',size); el.current.appendChild(svg); }
    }
  },[name,size]);
  return <span ref={el} style={{display:'inline-flex',alignItems:'center',...(p.style||{})}} className={p.className}/>;
};

// ── Toast ──────────────────────────────────────────────────────────
function Toast({msg,type='success',onClose}){
  useEffect(()=>{const t=setTimeout(onClose,3000);return()=>clearTimeout(t)},[]);
  return <div className="toast"><span style={{color:type==='success'?'var(--success)':'var(--danger)',fontSize:18}}>
    {type==='success'?'✓':'✗'}</span>{msg}</div>;
}

// ── Header ─────────────────────────────────────────────────────────

    setSearch(v);

    <header className="sticky" style={{background:'var(--surface)',borderBottom:'1.5px solid var(--border)',boxShadow:'var(--shadow)'}}>

      </div>
      <div>
        <label style={{fontSize:13,fontWeight:600,marginBottom:6,display:'block'}}>Catatan (opsional)</label>
        <textarea className="input-field" rows={3} placeholder="Catatan atau detail tambahan..." value={form.note} onChange={e=>setForm({...form,note:e.target.value})} style={{resize:'vertical'}}/>
      </div>
      <div>
        <label style={{fontSize:13,fontWeight:600,marginBottom:6,display:'block'}}>Upload File (opsional)</label>
        <input type="file" className="input-field" onChange={e=>setForm({...form,file:e.target.files[0]})} style={{padding:10}}/>

      </div>
      <button className="btn btn-primary" style={{justifyContent:'center',marginTop:8}} onClick={submit}><Icon name="Send" size={16}/>Kirim Order</button>
    </div>
  </div></div>);
}

// ── Cart Drawer ─────────────────────────────────────────────────────
function CartDrawer({cart,setCart,onClose,setShowOrder}){

  return(<>

    <div style={{position:'fixed',top:0,right:0,bottom:0,width:360,background:'var(--surface)',zIndex:500,padding:24,borderLeft:'1.5px solid var(--border)',boxShadow:'var(--shadow-lg)',overflowY:'auto'}}>

              <div style={{color:'var(--primary)',fontWeight:700,fontSize:14}}>{item.price}</div>

          <div style={{display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:16,marginBottom:4}}>

        </div>
      </>}
    </div>

// ── Check Order Page ────────────────────────────────────────────────

        </div>
        <span className={`order-status ${statusClass[result.status]}`}>{statusLabel[result.status]}</span>

      <div className="divider"/>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>

      </div>
      <div className="divider"/>
      <a href={`https://wa.me/628123456789?text=Halo, saya ingin tanya status order ${result.id}`} target="_blank" className="btn btn-primary" style={{justifyContent:'center',width:'100%'}}><Icon name="MessageCircle" size={16}/>Hubungi via WhatsApp</a>
    </div>:<div style={{textAlign:'center',padding:40,background:'var(--surface)',borderRadius:'var(--radius)',border:'1.5px solid var(--border)'}}>
      <div style={{fontSize:48,marginBottom:16}}>🔍</div>
      <p style={{fontWeight:600,marginBottom:8}}>Order tidak ditemukan</p>
      <p style={{fontSize:13,color:'var(--muted)'}}>Pastikan nomor order benar. Contoh: SKY-2026-001</p>
    </div>)}
    <div style={{marginTop:40,background:'var(--accent)',borderRadius:14,padding:20}}>
      <p style={{fontSize:13,fontWeight:600,marginBottom:8}}>📦 Contoh nomor order untuk demo:</p>
      {ORDERS_DUMMY.map(o=><button key={o.id} onClick={()=>{setQ(o.id);setResult(o);setSearched(true)}} style={{display:'inline-block',margin:'4px',padding:'4px 12px',borderRadius:8,background:'var(--surface)',border:'1.5px solid var(--border)',fontSize:12,fontWeight:700,cursor:'pointer',color:'var(--primary)'}}>{o.id}</button>)}

// ── App ─────────────────────────────────────────────────────────────
function App(){
  const [dark,setDark]=useState(()=>{try{return localStorage.getItem('sky-dark')==='1'}catch{return false}});
  const [page,setPage]=useState('home');
  const [cart,setCart]=useState([]);
  const [showCart,setShowCart]=useState(false);
  const [showOrder,setShowOrder]=useState(false);
  const [selectedProduct,setSelectedProduct]=useState(null);
  const [toast,setToast]=useState(null);
  const addToast=(msg,type='success')=>setToast({msg,type});
  const addToCart=(p)=>{setCart(c=>[...c,p]);addToast(`${p.name} ditambahkan ke keranjang!`);};
  useEffect(()=>{
    document.body.className=dark?'dark':'';
    try{localStorage.setItem('sky-dark',dark?'1':'0')}catch{}
  },[dark]);
  const isAdminPage=page==='dashboard-admin';
  const catIds=['produk-digital','jasa-web','sistem-bisnis','percetakan','akun-digital','barang-ready'];
  return(<div style={{minHeight:'100vh',background:'var(--bg)',color:'var(--text)'}}>
    {!isAdminPage&&<Header dark={dark} toggleDark={()=>setDark(!dark)} page={page} setPage={setPage} cart={cart} setShowCart={setShowCart}/>}
    {isAdminPage?(
      <div>
        <div style={{background:'var(--surface)',borderBottom:'1.5px solid var(--border)',padding:'12px 24px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <button onClick={()=>setPage('home')} style={{background:'none',border:'none',cursor:'pointer',display:'flex',alignItems:'center',gap:8,color:'var(--muted)',fontSize:13,fontWeight:600}}><Icon name="ArrowLeft" size={16}/>Kembali ke Toko</button>
          <div style={{display:'flex',gap:10,alignItems:'center'}}>
            <button onClick={()=>setDark(!dark)} style={{background:'var(--accent)',border:'none',borderRadius:10,width:36,height:36,display:'flex',alignItems:'center',justifyContent:'center',color:'var(--primary)'}}><Icon name={dark?'Sun':'Moon'} size={16}/></button>
            <div style={{display:'flex',alignItems:'center',gap:8}}><div style={{width:32,height:32,borderRadius:'50%',background:'linear-gradient(135deg,var(--primary),var(--amber))',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:800,fontSize:13}}>A</div><span style={{fontSize:13,fontWeight:600}}>Admin</span></div>
          </div>
        </div>
        <AdminDashboard/>
      </div>
    ):(<main>
      {page==='home'&&<HomePage setPage={setPage} addToCart={addToCart} setShowOrder={setShowOrder} setSelectedProduct={setSelectedProduct}/>}
      {catIds.includes(page)&&<CategoryPage catId={page} addToCart={addToCart} setShowOrder={setShowOrder} setSelectedProduct={setSelectedProduct}/>}
      {page==='cek-order'&&<CekOrderPage/>}
      {(page==='home'||catIds.includes(page)||page==='cek-order')&&<Footer setPage={setPage}/>}
    </main>)}
    {showCart&&<CartDrawer cart={cart} setCart={setCart} onClose={()=>setShowCart(false)} setShowOrder={setShowOrder}/>}
    {showOrder&&<OrderModal product={selectedProduct} onClose={()=>{setShowOrder(false);setSelectedProduct(null)}} addToast={addToast}/>}
    {toast&&<Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
